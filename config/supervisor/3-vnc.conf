[program:VNC]
command=bash -c 'PW=$(jq -r "if .password == null or .password == \"\" then \"\" else (.password | tostring) end" /data/options.json 2>/dev/null); if [ -n "$PW" ]; then mkdir -p $HOME/.config/tigervnc && echo -n "$PW" | vncpasswd -f > $HOME/.config/tigervnc/passwd && exec x0vncserver -PasswordFile $HOME/.config/tigervnc/passwd -display :0 -SecurityTypes=VncAuth; else exec x0vncserver -display :0 -SecurityTypes=None; fi'

startsecs=0
autorestart=unexpected
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=3
