[program:Xvfb]
command=bash -c 'RES=$(jq --raw-output ".resolution // \"1024x768\"" /data/options.json 2>/dev/null); Xvfb $DISPLAY -screen 0 "${RES:-1024x768}x24" -nolisten unix'

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
